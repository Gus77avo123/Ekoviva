<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Frete - Ekoviva</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rastreamento.css">
</head>
<body>
    <div class="top-bar">
        <div class="container-top">
             <a href="perfil.html" class="back-to-profile" data-lang-key="backToProfile">← Voltar ao Perfil</a>
             <div class="language-switcher">
                <a href="#" class="lang-link active" data-lang="pt">PT</a>
                <a href="#" class="lang-link" data-lang="en">EN</a>
            </div>
        </div>
    </div>
    <div class="container">
        <h1><i class="bi bi-truck"></i> <span data-lang-key="pageTitle">Rastreamento de Frete</span></h1>
        
        <div class="input-group">
            <i class="bi bi-qr-code-scan icon"></i>
            <input type="text" id="trackingCode" data-placeholder-key="placeholder">
        </div>
        
        <button id="trackButton" data-lang-key="trackButton">Rastrear Pedido</button>
        
        <div class="spinner" id="loading-spinner"></div>
        <div id="error-message"></div>
        <div id="result">
            <h3 id="result-title"></h3>
            <ul class="timeline" id="tracking-timeline"></ul>
            <button id="btn-confirmar-entrega" style="display: none;" data-lang-key="confirmDeliveryButton">Confirmar Recebimento</button>
        </div>
    </div>

    <script src="rastreamento.js"></script>
</body>
</html>
