<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - eKoviva</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <a href="index.html">
                    <img src="./imagem/logo2.png" alt="eKoviva" style="filter: brightness(0) invert(1);">
                </a>
            </div>
            <nav class="nav-links">
                <button class="nav-btn active" onclick="showSection('overview')">
                    <i class="bi bi-grid-fill"></i> <span data-lang-key="pageTitle">Visão Geral</span>
                </button>
                <button class="nav-btn" onclick="showSection('orders')">
                    <i class="bi bi-bag-check-fill"></i> <span data-lang-key="historyTitle">Meus Pedidos</span>
                </button>
                <a href="index.html" class="nav-btn">
                    <i class="bi bi-shop"></i> <span data-lang-key="backToHomeButton">Ir para Loja</span>
                </a>
            </nav>
            <div class="logout-area">
                <button class="nav-btn logout" onclick="logout()">
                    <i class="bi bi-box-arrow-left"></i> <span data-lang-key="logoutButton">Sair</span>
                </button>
            </div>
        </aside>

        <main class="content-area">
            <header class="top-header">
                <h2 id="welcome-message">...</h2>
                <div class="header-right">
                    <div class="language-switcher">
                        <a href="#" class="lang-link active" data-lang="pt">PT</a>
                        <a href="#" class="lang-link" data-lang="en">EN</a>
                    </div>
                    <div class="profile-mini">
                        <img id="header-avatar" src="https://via.placeholder.com/50" alt="Avatar">
                    </div>
                </div>
            </header>

            <section id="section-overview" class="fade-in">
                <div class="grid-dashboard">
                    <div class="card profile-card">
                        <div class="profile-header-img">
                            <label for="input-foto" class="avatar-wrapper">
                                <img id="foto-perfil" src="https://via.placeholder.com/150" onerror="this.src='https://via.placeholder.com/150'" alt="Foto">
                                <div class="overlay-edit"><i class="bi bi-camera"></i></div>
                            </label>
                            <input type="file" id="input-foto" accept="image/*">
                        </div>
                        <h3 id="nome-display">...</h3>
                        <p id="email-display" class="text-muted">...</p>
                        
                        <div class="profile-actions">
                            <button class="btn-primary" id="btn-abrir-modal">
                                <i class="bi bi-pencil"></i> <span data-lang-key="editButton">Editar</span>
                            </button>
                            <button class="btn-secondary" id="btn-abrir-senha">
                                <i class="bi bi-key"></i> <span data-lang-key="changePassButton">Senha</span>
                            </button>
                        </div>
                    </div>

                    <div class="stats-column">
                        <div class="card stat-card">
                            <div class="stat-icon purple"><i class="bi bi-bag-heart"></i></div>
                            <div class="stat-info">
                                <h4 id="total-pedidos">0</h4>
                                <p data-lang-key="statOrders">Pedidos Feitos</p>
                            </div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon green"><i class="bi bi-cash-coin"></i></div>
                            <div class="stat-info">
                                <h4 id="total-gasto">R$ 0,00</h4>
                                <p data-lang-key="statInvested">Total Investido</p>
                            </div>
                        </div>
                    </div>

                    <div class="card details-card full-width">
                        <h3><i class="bi bi-person-lines-fill"></i> <span data-lang-key="shippingInfoTitle">Informações de Contato</span></h3>
                        <div class="details-grid">
                            <div class="detail-item">
                                <label data-lang-key="labelPhoneJS">Telefone</label>
                                <p id="telefone">...</p>
                            </div>
                            <div class="detail-item">
                                <label data-lang-key="labelAddressJS">Endereço</label>
                                <p id="endereco">...</p>
                            </div>
                            <div class="detail-item">
                                <label data-lang-key="labelDobJS">Nascimento</label>
                                <p id="data-nascimento">...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="section-orders" class="fade-in" style="display: none;">
                <div class="card">
                    <h3 class="card-title" data-lang-key="historyTitle">Meus Pedidos</h3>
                    <div class="table-responsive">
                        <table class="modern-table">
                            <thead>
                                <tr>
                                    <th data-lang-key="thId">ID</th>
                                    <th data-lang-key="thDate">Data</th>
                                    <th data-lang-key="thStatus">Status</th>
                                    <th data-lang-key="thTotal">Total</th>
                                    <th data-lang-key="thActions">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="rastreamento-list"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-edicao" class="modal">
        <div class="modal-content">
            <span class="close-btn closeModalBtn">&times;</span>
            <h2 data-lang-key="modalTitle">Editar Dados</h2>
            <form id="form-edicao">
                <input type="text" id="edit-nome" placeholder="Nome Completo" maxlength="100" required>
                <input type="tel" id="edit-telefone" placeholder="Telefone" maxlength="20">
                <input type="text" id="edit-endereco" placeholder="Endereço" maxlength="255">
                <input type="date" id="edit-data-nascimento">
                <button type="submit" class="btn-save" data-lang-key="saveButton">Salvar</button>
            </form>
        </div>
    </div>

    <div id="modal-senha" class="modal">
        <div class="modal-content">
            <span class="close-btn closeModalBtn">&times;</span>
            <h2 data-lang-key="modalPassTitle">Alterar Senha</h2>
            <form id="form-senha">
                <input type="password" id="senha-atual" placeholder="Senha Atual" required>
                <input type="password" id="nova-senha" placeholder="Nova Senha" required>
                <input type="password" id="confirmar-senha" placeholder="Confirmar Senha" required>
                <button type="submit" class="btn-save" data-lang-key="savePassButton">Atualizar</button>
            </form>
        </div>
    </div>

    <div id="modal-detalhes" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-btn closeModalBtn">&times;</span>
            <h2 id="detalhes-titulo">Detalhes do Pedido</h2>
            <div class="order-summary-box">
                <p><strong>Data:</strong> <span id="det-data"></span></p>
                <p><strong>Status:</strong> <span id="det-status"></span></p>
            </div>
            <div class="order-items-list">
                <table class="details-table">
                    <thead>
                        <tr>
                            <th data-lang-key="thProduct">Produto</th>
                            <th data-lang-key="thQty">Qtd.</th>
                            <th data-lang-key="thPrice">Preço Unit.</th>
                            <th data-lang-key="thSubtotal">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="lista-itens-pedido"></tbody>
                </table>
            </div>
            <div class="order-total-box">
                <p><span data-lang-key="labelTotal">Total:</span> <strong id="det-total" style="color: var(--cor-primaria); font-size: 1.2rem;"></strong></p>
            </div>
        </div>
    </div>

    <script src="perfil.js"></script>
    <script>
        function showSection(sectionId) {
            document.getElementById('section-overview').style.display = 'none';
            document.getElementById('section-orders').style.display = 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + sectionId).style.display = 'block';
            
            const btns = document.querySelectorAll('.nav-btn');
            if(sectionId === 'overview') btns[0].classList.add('active');
            if(sectionId === 'orders') btns[1].classList.add('active');
        }
    </script>
</body>
</html>
